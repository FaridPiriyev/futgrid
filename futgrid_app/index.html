    <script>
      // ThemeToggle.jsx ilə eyni qayda: standart tünd tema, yalnız seçilibsə açıq.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("fg-theme-v3") === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>

    />
