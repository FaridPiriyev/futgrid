# futgrid.az / www.futgrid.az -> frontend, api.futgrid.az -> API (Let's Encrypt via certbot webroot)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream futgrid_api { server api:3000; keepalive 16; }

# HTTP: ACME challenge + redirect everything else to HTTPS
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://futgrid.az$request_uri; }
}

server {
    listen 80;
    server_name futgrid.az www.futgrid.az api.futgrid.az;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Frontend
server {
    listen 443 ssl default_server;
    http2 on;
    server_name futgrid.az www.futgrid.az;

    ssl_certificate     /etc/letsencrypt/live/futgrid.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futgrid.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Requests by bare IP over HTTPS -> canonical domain
    if ($host !~* ^(www\.)?futgrid\.az$) { return 301 https://futgrid.az$request_uri; }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* ^/(images|logos|flags|data)/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API + Socket.io
server {
    listen 443 ssl;
    http2 on;
    server_name api.futgrid.az;

    ssl_certificate     /etc/letsencrypt/live/futgrid.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futgrid.az/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://futgrid_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
