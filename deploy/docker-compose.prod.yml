# FutGrid — single-droplet production stack (DigitalOcean)
# Usage (from repo root on server):  docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: futgrid

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: futgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: futgrid
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futgrid -d futgrid"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://futgrid:${POSTGRES_PASSWORD}@postgres:5432/futgrid?schema=public
      REDIS_URL: redis://redis:6379/0
      CDN_DATA_DIR: /app/storage/cdn-data
      CDN_MEDIA_DIR: /app/storage/cdn-media
      DATA_DIR: /app/packages/game-core/data
      TRUST_PROXY: "true"
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: ${API_URL}/v1
        VITE_SOCKET_URL: ${API_URL}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api

volumes:
  pg_data:
  redis_data:
  api_storage:
